name: Google Trends Weekly Report

on:
  schedule:
    # Every Tuesday at 06:00 UTC
    - cron: "0 6 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch Google Trends data
        id: trends
        run: python scripts/google_trends_weekly.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "Google Trends weekly report: ${{ steps.trends.outputs.range_start }} to ${{ steps.trends.outputs.range_end }}"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Open report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Google Trends Weekly Report: ${{ steps.trends.outputs.range_start }} to ${{ steps.trends.outputs.range_end }}" \
            --body-file "${{ steps.trends.outputs.report_path }}"
